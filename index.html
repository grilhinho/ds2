<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pizzaria Menor Quenti</title>
    <style>
        /* Garante que a página ocupe toda a altura da tela */
        html, body { 
            height: 100%; 
            margin: 0; 
        }
        /* Transforma o body em um container flexível vertical */
        body { 
            font-family: Arial; 
            text-align: center; 
            background: #fff8f0; 
            display: flex;
            flex-direction: column;
        }
        header { background: #c0392b; color: white; padding: 25px; }
        
        /* Container principal que vai empurrar o rodapé para baixo */
        .conteudo {
            flex: 1;
            padding: 20px 0;
        }
        
        .botao { display: block; background: #c0392b; color: white; padding: 15px; margin: 15px auto; width: 220px; text-decoration: none; border-radius: 6px; }
        footer { background: #2c3e50; color: white; padding: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>🍕 Pizzaria Menor Quenti</h1>
    </header>

    <!-- Adicionado uma div para envelopar os botões e empurrar o rodapé -->
    <div class="conteudo">
        <a href="cardapio.html" class="botao">Cardápio</a>
        <a href="sobre.html" class="botao">Sobre</a>
        <a href="contato.html" class="botao">Contato</a>
        <a href="pedido.html" class="botao">Fazer Pedido</a>
    </div>

    <footer>
        <p>© 2026 Pizzaria Menor Quenti</p>
    </footer>

</body>
</html>
