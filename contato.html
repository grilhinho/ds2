<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Menor Quenti</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            text-align: center;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        header {
            background: #c0392b;
            color: white;
            padding: 18px 15px;
        }

        header h2 {
            margin: 0 0 10px 0;
            font-size: 1.8em;
        }

        header a {
            color: #ffeaea;
            margin: 0 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05em;
        }

        header a:hover {
            text-decoration: underline;
        }

        .conteudo {
            flex: 1;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .info-box {
            background: white;
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            font-size: 1.15em;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .icone {
            background: #c0392b;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .botao-whatsapp {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.35);
            transition: background 0.2s, transform 0.2s;
        }

        .botao-whatsapp:hover {
            background: #1ebe57;
            transform: translateY(-2px);
        }

        .horario {
            background: #fff3f0;
            border-left: 5px solid #c0392b;
            padding: 12px 18px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
            font-size: 1.05em;
        }

        footer {
            background: #2c3e50;
            color: white;
            padding: 14px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <header>
        <h2>Contato</h2>
        <a href="index.html">Início</a>
        <a href="cardapio.html">Cardápio</a>
        <a href="sobre.html">Sobre</a>
        <a href="pedido.html">Pedido</a>
    </header>

    <div class="conteudo">

        <div class="info-box">
            <div class="info-item">
                <div class="icone">📍</div>
                <div>
                    <strong>Endereço</strong><br>
                    Rua das Pizzas, 123 – Centro<br>
                    São Paulo – SP
                </div>
            </div>

            <div class="info-item">
                <div class="icone">📞</div>
                <div>
                    <strong>Telefone</strong><br>
                    (11) 99999-9999
                </div>
            </div>

            <div class="info-item">
                <div class="icone">🕒</div>
                <div>
                    <strong>Horário de Funcionamento</strong>
                    <div class="horario">
                        Todos os dias • 18h às 23h
                    </div>
                </div>
            </div>
        </div>

        <p style="margin-bottom: 12px; font-size: 1.1em;">
            Prefere falar direto pelo WhatsApp?
        </p>
        <a href="https://wa.me/5511999999999" class="botao-whatsapp" target="_blank">
            📱 Chamar no WhatsApp
        </a>

    </div>

    <footer>
        <p>© 2026 Pizzaria Menor Quenti</p>
    </footer>

</body>
</html>
